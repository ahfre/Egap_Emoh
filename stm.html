<!doctype html>
<meta charset="utf-8">
<title>STM Pro</title>
<p id="status">Leter etter StopTheMadness Pro …</p>
<script>
let ferdig = false;
function sjekk() {
  if (ferdig) return;
  const s = document.documentElement.outerHTML + " " +
    performance.getEntriesByType("resource").map(e => e.name).join(" ");
  const m = s.match(/safari-web-extension:\/\/([0-9A-F-]{36})/i);
  if (!m) return;
  ferdig = true;
  location.replace("safari-web-extension://" + m[1] + "/options.html");
}
new MutationObserver(sjekk).observe(document.documentElement,
  { childList: true, subtree: true, attributes: true });
addEventListener("load", sjekk);
sjekk();
setTimeout(() => {
  if (!ferdig) document.getElementById("status").textContent = "Fant ikke UUID.";
}, 3000);
</script>
